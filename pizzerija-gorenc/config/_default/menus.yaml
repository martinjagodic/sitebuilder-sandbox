# One menu for every language. `pageRef` is the page's path in content/
# ("/about" for content/about.sl.md) and links to its translation in each
# language, skipping languages it has none in. Without a `name`, the page's
# menu title is shown. Use `url` only for links off the site.
main:
  - pageRef: /
    weight: 10
  - pageRef: /jedilnik
    weight: 20
  - pageRef: /kontakt
    weight: 30
