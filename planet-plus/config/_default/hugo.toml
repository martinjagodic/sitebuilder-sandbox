# Planet Plus — site configuration.
#
# Editable in the CMS under General → Site Configuration. Decap preserves keys
# it does not declare, so the structural blocks below survive an editor saving
# site settings — but TOML comments may not, so the reasoning lives in
# sitebuilder-core's CLAUDE.md too.

title = "Planet Plus"
baseURL = "https://planet-plus.pages.dev/"
# The main language: served at the root, and never turned off.
defaultContentLanguage = "sl"
timeZone = "Europe/Ljubljana"
disableFastRender = true

[module]
  [[module.imports]]
    path = "github.com/martinjagodic/sitebuilder-core"

# Every language this site may use. The CMS turns the other one on and off
# under General → Site Configuration → Languages, which writes `disabled`.
# Page files name their language: about.sl.md, about.en.md.
[languages]
  [languages.sl]
    label = "Slovenščina"
    locale = "sl-SI"
    weight = 1
    disabled = false
  [languages.en]
    label = "English"
    locale = "en-GB"
    weight = 2
    disabled = true

# Hugo only merges [params] from a module automatically. These blocks pull in
# core's other defaults too — including the output format that renders the CMS
# config at /admin/config.yml. Leave them alone.
[build]
  _merge = "deep"

[markup]
  _merge = "deep"

[security]
  _merge = "deep"

[mediaTypes]
  _merge = "deep"

[outputFormats]
  _merge = "deep"

[outputs]
  _merge = "deep"

[params]
  description = "Salon pohištva v Ljubljani: kuhinje, dnevne sobe, spalnice, vrata in zasteklitve priznanih evropskih proizvajalcev ter svetovanje oblikovalcev."
  author = "Planet Plus"
  # Open Graph fallback image (absolute URL)
  image = "/media/uploads/domov-naslovna.jpg"
  logo = "/media/brand/logo.png"

  # Folder for this project's files inside the shared Bunny zone. The zone
  # itself is set once in core (bunnyUrl).
  mediaPrefix = "planet-plus"
  # Uncomment to serve media straight from static/media/ with no Bunny
  # transforms — a local-first site before its files are uploaded to Bunny.
  # bunnyUrl = ""

  # Decap CMS. Create the site in the Decap Turbo dashboard, paste the UUID
  # from its Overview tab, then rebuild — the config regenerates itself.
  [params.cms]
    # "local" keeps the CMS on localhost via `npx decap-server`.
    # Switch to "turbo-github" once the site is connected in Decap Turbo.
    backend = "local"
    repo = "martinjagodic/sitebuilder-client-planet-plus"
    branch = "main"
    turboSiteId = ""
    # "repo" stores uploads in static/media/uploads.
    # "s3" uses Bunny Storage through Turbo's media proxy.
    mediaLibrary = "repo"

  # Dark and warm: near-black with brass, EB Garamond headings over Manrope.
  # Every text colour passes AA on background, surface and dark. (Cormorant
  # Garamond was the first pick; its lowercase caron floats above š, č, ž.)
  [params.theme]
    scheme = "dark"
    fonts = "eb-garamond:400,500|manrope:400,500,600"
    font_primary = "Manrope, system-ui, sans-serif"
    font_heading = "'EB Garamond', Georgia, serif"
    font_heading_weight = "400"
    color_primary = "#c8a26b"
    color_on_primary = "#121110"
    color_secondary = "#9a8f82"
    color_text = "#cfc8be"
    color_heading = "#f3eee7"
    color_background = "#121110"
    color_surface = "#1b1917"
    color_dark = "#0b0a09"
    radius = "0.125rem"
    logo_height = "1.5rem"
    content_width = "calc(1280px + (2 * var(--container-padding)))"
